{% extends 'prof/baseprof.html' %}
{% block title %}Enregistrer Cours{% endblock %}

{% block styles %}
<style>
/* Style global pour la page */
body {
    background-color: #f9f9f9; /* Fond clair et doux */
    font-family: 'Arial', sans-serif;
    margin: 10px;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Conteneur du formulaire */
form {
    background-color: #ffffff; /* Fond blanc */
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Ombre douce */
    width: 100%;
    max-width: 800px; /* Largeur maximale */
    text-align: center;
    display: grid;
    grid-template-columns: 1fr 1fr; /* Deux colonnes par ligne */
    gap: 20px; /* Espace entre les champs */
    margin-top: 70px; /* Ajout d'un espacement sous l'en-tête */
}

/* Titre du formulaire */
form h1 {
    font-size: 28px;
    color: #333;
    margin-bottom: 30px;
    grid-column: span 2; /* Le titre occupe toute la largeur */
}

/* Style des labels */
form label {
    font-size: 16px;
    color: #555;
    margin-bottom: 10px;
    display: block;
}

/* Style des champs de texte */
form input,
form select {
    width: 100%; /* Champs qui occupent toute la largeur de la colonne */
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 16px;
    box-sizing: border-box;
    background-color: #f7f7f7; /* Fond clair pour les champs */
    transition: border 0.3s ease, background-color 0.3s ease;
}

/* Changements de couleur au focus */
form input:focus,
form select:focus {
    border-color: #007bff; /* Bordure bleue */
    background-color: #fff; /* Fond blanc */
    outline: none; /* Enlève l'effet de contour par défaut */
}

/* Style du bouton de soumission */
form button {
    width: 100%;
    padding: 12px;
    background-color: #1c1d1e; /* Bleu */
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    margin-top: 20px;
    grid-column: span 2; /* Le bouton occupe toute la largeur */
}

/* Effet au survol du bouton */
form button:hover {
    background-color: #0056b3; /* Bleu foncé au survol */
}

/* Lien pour la redirection */
.add-file {
    margin-top: 20px;
    grid-column: span 2; /* Le lien occupe toute la largeur */
}

.add-file a {
    color: #007bff;
    text-decoration: none;
    font-size: 16px;
}

.add-file a:hover {
    text-decoration: underline;
}

</style>
{% endblock styles %}

{% block profcontent %}

    <form method="post" enctype="multipart/form-data">
    
<div class="icon-top">
    <i class="fas fa-cloud-upload-alt"></i>
</div>

<h1>Upload Cours</h1>
        <h1>Upload Cours</h1>
        
        {% csrf_token %}
        {{ form.as_p }}
        
        <button type="submit" class="btn btn-success" >Upload</button>
        <!--<div class="add-file"><a href="{% url 'cours_list_prof' %}">Voir cours, TD ou Exercices Enregistrés</a></div>-->
        <div class="add-file">
            <a href="{% url 'cours_list_prof' %}">
                <i class="fas fa-book fa-3x"></i> Voir cours, TD ou Exercices Enregistrés
            </a>
        </div>
        
    </form>
{% endblock profcontent %}
