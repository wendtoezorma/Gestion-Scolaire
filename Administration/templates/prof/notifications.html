<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            background: none;
        }

        h1 {
            color: #007BFF;
            text-align: center;
            animation: fadeIn 2s ease-out;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            animation: slideIn 1s ease-out;
        }

        li {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
            padding: 15px;
            transition: background 0.3s;
            animation: slideIn 1s ease-out;
        }

        li:hover {
            background: #f1f1f1;
        }

        @keyframes slideIn {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0); }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .loader {
            border: 4px solid #f3f3f3; 
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .notification-message {
            margin-bottom: 10px;
        }

        .text-center {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Notifications</h1>

    <!-- Loader visible until notifications are loaded -->
    <div class="loader" id="loader"></div>

    {% if notifications %}
        <ul>
            {% for notification in notifications %}
                <li>
                    <p class="notification-message">{{ notification.message }}</p>
                    <small>{{ notification.date }}</small>
                    <span>(Lue)</span>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Aucune notification.</p>
    {% endif %}

    <script>
        // Simulate loading delay and hide the loader after the notifications are loaded
        window.onload = function() {
            setTimeout(function() {
                document.getElementById('loader').style.display = 'none';
            }, 2000); // Hide the loader after 2 seconds (simulating loading time)
        };
    </script>
</body>
</html>
