{% extends "Administration/base.html" %}
{% load custom_filters %}
{% block title %}Choisir un Module{% endblock %}
{% block styles %}
{{ block.super }}

    <style>
        /* Appliquez ce style uniquement à ce template */
        .form-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Prend toute la hauteur de l'écran */
            padding: 0;
            margin: 0;
        }

        #choisir-module-form {
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 2px solid #eaeaec; /* Bordure bleue */
        }

        #choisir-module-form p {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2575fc; /* Texte bleu */
        }

        #choisir-module-form label {
            font-size: 1em;
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        #choisir-module-form select {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            margin-bottom: 20px;
            border: 2px solid #2575fc; /* Bordure bleue */
            border-radius: 5px;
            outline: none;
            background: white;
            color: black;
        }

        #choisir-module-form button {
            background: #2575fc; /* Bleu */
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
        }

        #choisir-module-form button:hover {
            background: #1b5bcc;
        }

        #choisir-module-form button:active {
            background: #154aa8;
        }

        #choisir-module-form select:focus {
            box-shadow: 0 0 10px rgba(37, 117, 252, 0.6);
        }

        @media (max-width: 768px) {
            #choisir-module-form {
                padding: 20px;
            }
        }
    </style>

{% endblock %}
{% block content %}
<body>
    <div class="form-container">
        <form id="choisir-module-form" method="post">
            <p>Niveau : {{ niveau }} | Filière : {{ filiere }} </p>

            {% csrf_token %}
            <label for="cours_module">Choisir un module :</label>
            <select name="cours_module" id="cours_module">
                {% for module in modules %}
                    <option value="{{ module.Id_module }}">{{ module.nom_module }}</option>
                {% endfor %}
            </select>
            <button type="submit">Continuer</button>
        </form>
    </div>

    <script>
        document.getElementById('choisir-module-form').onsubmit = function(event) {
            event.preventDefault();

            const form = new FormData(event.target);
            const niveau = "{{ niveau }}";
            const filiere = "{{ filiere }}";

            fetch(window.location.href, {
                method: "POST",
                headers: {
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: form
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Erreur dans la requête');
                }
                return response.json();
            })
            .then(data => {
                if (data.module_id) {
                    window.location.href = `/avancement/${niveau}/${filiere}/${data.module_id}/`;
                } else {
                    alert("Module ID introuvable !");
                }
            })
            .catch(error => {
                console.error('Erreur détectée :', error);
                alert('Une erreur est survenue.');
            });
        };
    </script>
{% endblock %}
