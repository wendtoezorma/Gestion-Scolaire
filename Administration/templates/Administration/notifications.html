<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f0f8ff, #add8e6);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 3.5rem;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            animation: fadeInUp 2s ease-out;
        }

        /* Container for notifications */
        .container {
            width: 90%;
            max-width: 800px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
            padding: 40px;
            animation: scaleUp 2s ease-out;
            overflow: hidden;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* List of notifications */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            background-color: #f9f9f9;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
            animation: fadeIn 2s ease-out, slideUp 1.5s ease-out;
            transform: translateY(50px);
        }

        li:last-child {
            margin-bottom: 0;
        }

        strong {
            font-size: 1.5rem;
            color: #2c3e50;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 25px;
            font-size: 1.5rem;
            color: #888;
        }

        /* Animations */
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(-40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleUp {
            0% {
                transform: scale(0.6);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Hover effect for notifications */
     
    </style>
</head>
<body>
    <div class="container">
        <h1>Liste des Notifications</h1>
        <ul>
            {% for notification in notifications %}
                <li>
                    <strong>{{ notification.date|date:"d/m/Y H:i" }}</strong> : 
                    {{ notification.message }}
                </li>
            {% empty %}
                <div class="empty">
                    <li>Aucune notification disponible.</li>
                </div>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
