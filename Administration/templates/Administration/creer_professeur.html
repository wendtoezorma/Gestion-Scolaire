{% extends "Administration/base.html" %}

{% block title %}Créer un Professeur{% endblock %}

{% block styles %}
{{ block.super }}

<style>
  /* Styles spécifiques au template enfant */
  body {
    overflow-y: auto !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: flex-start !important; /* Aligner à gauche */
    justify-content: flex-start !important;
    min-height: 100vh !important;
    background: none !important; /* Supprime l'arrière-plan par défaut */
    padding-top: 80px; /* Hauteur de l'entête */
    margin-left: 200px; /* Supprimer la marge gauche */

  }

  .background {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    background-color: #ffffff; /* Fond blanc */
    overflow: hidden;
  }

  @keyframes gradientAnimation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes bubbleAnimation {
    0% { transform: translate(0, 0); }
    50% { transform: translate(-100%, 100%); }
    100% { transform: translate(0, 0); }
  }

  form {
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    max-width: 900px; /* Largeur maximale du formulaire */
    text-align: left;
    background-color: NONE;
    position: relative;
    z-index: 2;
    margin: 40px 0; /* Supprimer la marge à gauche et à droite */
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); /* Grille responsive */
    gap: 30px; /* Espacement entre les éléments */
  }

  form div {
    display: flex;
    flex-direction: column;
  }

  form h2 {
    grid-column: span 2; /* Titre occupe toute la largeur */
    margin-bottom: 20px;
    color: #333;
  }

  form label {
    margin-bottom: 10px;
    font-weight: bold;
    color: #333;
  }

  form input[type="text"],
  form input[type="email"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 25px;
    font-size: 16px;
    box-sizing: border-box;
    background-color: rgba(255, 255, 255, 0.9);
    color: #333;
  }

  form input[type="submit"] {
    background-color: #007bff;
    color: #fff;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 25px;
    cursor: pointer;
    transition: background-color 0.3s ease;
    width: 100%; /* Le bouton de soumission occupe toute la largeur de sa cellule */
  }

  form input[type="submit"]:hover {
    background-color: #0056b3;
  }

  .form-control {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #ced4da;
    border-radius: 20px;
    transition: background-color 0.3s ease;
    background-color: #ffffff;
  }
  
  .btn-primary {
    background-color:   #0056b3; /* Bleu ciel intense */
    color: #fff;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 25px;
    cursor: pointer;
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
  }

  .btn-primary:hover {
    background-color: #007bff; /* Bleu plus foncé */
    box-shadow: 0 4px 10px rgba(0, 123, 255, 0.5); /* Ombre bleutée */
  }

  
  

  form button {
    width: auto; /* Ajuste la taille selon le contenu */
    align-self: center; /* Centre le bouton */
  }

</style>
{% endblock %}

{% block content %}
<div class="background">
  
</div>

<form method="post">
  <h1>Créer un Professeur</h1>
  
  <br>
  {% csrf_token %}
  {{ form.as_p }}
  <br>
  <button type="submit" class="btn btn-primary">Enregistrer</button>
</form>
{% endblock %}
