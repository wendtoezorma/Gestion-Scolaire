{% extends "Administration/base.html" %}
{% block title %}Sélection du module pour ajouter des notes{% endblock %}

{% block content %}
<div class="background">
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
    <div class="bubble"></div>
</div>

<h1>Sélection du module pour ajouter des notes</h1><br>
<div class="form-container">
    <form method="get" action="{% url 'creer_note' %}">
        <label for="module">Choisir un module :</label>
        <select name="module_id" id="module">
            {% for module in modules %}
                <option value="{{ module.Id_module }}">{{ module.nom_module }}</option>
            {% endfor %}
        </select>
        <input type="hidden" name="filiere_id" value="{{ filiere_id }}">
        <input type="hidden" name="niveau" value="{{ niveau }}">
        <button type="submit">Sélectionner</button>
    </form>
</div>
{% endblock %}

{% block styles %}
{{ block.super }}

<style>
/* Styles spécifiques au template enfant */
body {
    overflow-y: auto !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: flex-start !important;
    min-height: 100vh !important;
    background: none !important; /* Supprime l'arrière-plan par défaut */
    font-family: 'Arial', sans-serif; /* Police élégante */
    color: #333; /* Couleur de texte par défaut */
}

.background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    background-image: linear-gradient(120deg, #007bff, #00bfff); /* Dégradé de bleu animé */
    animation: gradientAnimation 10s ease infinite;
}

@keyframes gradientAnimation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.background .bubble {
    position: absolute;
    background-color: rgba(255, 255, 255, 0.3);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    animation: bubbleAnimation 15s infinite;
}

@keyframes bubbleAnimation {
    0% { transform: translate(0, 0); }
    50% { transform: translate(-100%, 100%); }
    100% { transform: translate(0, 0); }
}

h1 {
    margin-top: 50px;
    color: #b7bec6; /* Couleur du titre */
    margin-bottom: 20px;
    font-size: 3rem; /* Taille de la police */
    text-align: center;
}

.form-container {
    display: flex;
    justify-content: center; /* Centre le formulaire horizontalement */
    align-items: center; /* Centre le formulaire verticalement */
    height: 50vh; /* Prend toute la hauteur de la vue */
}

form {
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2); /* Ombre plus douce */
    max-width: 700px;
    text-align: center;
    margin-top: 20px;
    background-color: rgba(255, 255, 255, 0.95); /* Légèrement plus opaque pour une meilleure lisibilité */
    position: relative;
    z-index: 2;
}

form label {
    display: block;
    margin-bottom: 10px;
    font-weight: bold;
    font-size: 1.2rem; /* Taille de la police */
    color: #555; /* Couleur légèrement plus douce */
}

form select,
form button {
    padding: 10px;
    margin-bottom: 15px;
    border: 2px solid #007bff; /* Bordure colorée */
    border-radius: 25px;
    font-size: 16px;
    box-sizing: border-box;
    background-color: #f8f9fa; /* Fond clair pour le select et le bouton */
    color: #333;
    transition: border-color 0.3s ease, background-color 0.3s ease;
}

form select:focus,
form button:focus {
    border-color: #0056b3; /* Couleur de la bordure lors du focus */
    outline: none; /* Supprimer le contour par défaut */
}

form button {
    background-color: #007bff;
    color: #fff;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 25px;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.2s ease;
}

form button:hover {
    background-color: #0056b3; /* Couleur au survol */
    transform: translateY(-2px); /* Légère élévation au survol */
}

form button:active {
    transform: translateY(0); /* Retour à la position d'origine lors du clic */
}

form select:hover {
    background-color: rgba(0, 123, 255, 0.1); /* Fond au survol pour le select */
}
</style>
{% endblock %}
