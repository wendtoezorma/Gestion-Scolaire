{% extends "Administration/base.html" %}

{% block title %}Sélection de la classe{% endblock %}

{% block styles %}
{{ block.super }}

<style>
body {
    overflow-y: auto !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center;
    justify-content: flex-start !important;
    min-height: 100vh !important;
    background: none !important;
    padding: 80px;
    font-family: Arial, sans-serif; /* Police uniforme */
}

form {
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
    max-width: 700px;
    text-align: center;
    background-color: rgba(255, 255, 255, 0.8);
    position: relative;
    z-index: 2;
    margin: 40px 0;
}

form label {
    display: block;
    margin-bottom: 12px; /* Espacement augmenté */
    font-size: 18px;
    font-weight: bold;
    color: #333;
    text-align: left;
}

form input[type="text"],
form input[type="email"],
form select {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px; /* Espacement uniforme */
    border: 1px solid #ccc;
    border-radius: 25px;
    font-size: 16px;
    box-sizing: border-box;
    background-color: rgba(255, 255, 255, 0.9);
    color: #333;
    transition: border-color 0.3s ease;
}

form input[type="text"]:focus,
form input[type="email"]:focus,
form select:focus {
    border-color: #0056b3;
    outline: none;
}

form input[type="submit"],
button#envoyer {
    width: 60%; /* Taille du bouton ajustée */
    padding: 14px;
    background-color: #0056b3;
    color: #fff;
    border: none;
    font-size: 18px;
    border-radius: 25px;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

form input[type="submit"]:hover,
button#envoyer:hover {
    background-color: #007bff;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 20px;
    box-sizing: border-box;
}
</style>

{% endblock %}

{% block content %}
<div class="container">
    <form>
        <h1>Sélection de la classe</h1>

        <label for="select_filiere">Filière :</label>
        <select id="select_filiere">
            {% for filiere in filieres %}
            <option value="{{ filiere.Id_filiere }}">{{ filiere.nom_filiere }}</option>
            {% endfor %}
        </select>
        <br><br>

        <label for="select_niveau">Niveau :</label>
        <select id="select_niveau">
          <option value="">Sélectionner un niveau</option>
          {% for value, display in niveaux %}
              <option value="{{ value }}">{{ display }}</option>
          {% endfor %}
        </select>
        <br><br>

        <button type="button" id="envoyer">Envoyer</button>
    </form>
</div>

<script>
document.getElementById("envoyer").addEventListener("click", function() {
    var filiere_id = document.getElementById("select_filiere").value;
    var niveau = document.getElementById("select_niveau").value;
    window.location.href = `/classe/${filiere_id}/${niveau}/`;
});
</script>
{% endblock %}
