{% extends "Administration/base.html" %}
{% block title %}Créer une filière{% endblock %}

{% block styles %}
{{ block.super }}

<style>
    body {
        font-family: Arial, sans-serif;
    }

    form {
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        max-width: 700px;
        text-align: center;
        background-color: rgba(255, 255, 255, 0.8);
        position: relative;
        z-index: 2;
        margin: 40px 0;
    }

    form label {
        display: block;
        margin-bottom: 12px;
        font-size: 18px;
        font-weight: bold;
        color: #333;
        text-align: left;
    }

    .form-control {
        width: 60%;
        padding: 12px; /* Augmenter la taille des champs */
        margin-bottom: 20px; /* Espacement uniforme */
        border: 1px solid #ccc;
        border-radius: 25px;
        font-size: 16px;
        background-color: rgba(255, 255, 255, 0.9);
    }

    .btn-primary {
        width: 60%; /* Ajuster la largeur du bouton */
        padding: 14px;
        background-color: #0056b3;
        color: #ffffff;
        border: none;
        font-size: 18px;
        border-radius: 25px;
        cursor: pointer;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    .btn-primary:hover {
        background-color: #007bff;
        box-shadow: 0 4px 10px rgba(0, 123, 255, 0.5);
    }

</style>

{% endblock %}

{% block content %}
<div class="main">
    <form method="post">
        <h1>Créer une filière</h1>
        <br><br>
        {% csrf_token %}
        {{ form.as_p }}
        <br><br>
        <button type="submit" class="btn-primary">Enregistrer</button>
    </form>
</div>
{% endblock %}
