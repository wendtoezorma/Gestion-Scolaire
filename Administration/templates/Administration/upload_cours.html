{% extends 'Administration/base.html' %}
{% block title %}Upload Cours{% endblock title %}
{% block styles %}
{{ block.super }}

<style>
    body {
        overflow-y: auto !important; /* Utilise l'overflow du template d'ajout de notes */
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: flex-start !important;
        min-height: 200vh !important;
        background: none !important; /* Supprime l'arrière-plan par défaut */
        
    }

    .background {
        position: fixed;
        top: 0;
        left: 0;
        width: 400%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
        background-color: #f0f4f8; /* Couleur de fond douce */
    }

    form {
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.2);
        max-width: 800px; /* Largeur fixe pour le formulaire */
        width: 150%; /* Permet au formulaire de s'ajuster à la taille de l'écran */
        text-align: center;
        margin: 20px auto; /* Centre le formulaire horizontalement */
        background-color:  rgba(255, 255, 255, 0.5);
        position: relative;
        z-index: 2;
    }

    form h1 {
        margin-bottom: 20px;
        color: #333;
        font-family: 'Arial', sans-serif;
    }

    form label {
        margin-bottom: 5px;
        font-weight: bold;
        color: #333;
        width: 200%; /* Prendre toute la largeur */
        text-align: left; /* Alignement à gauche */
    }

    form input[type="text"],
    form input[type="email"],
    form input[type="file"],
    form select,
    form input[type="number"],
    form input[type="submit"],
    .btn-success {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 2px solid #0e0e0e; /* Changez la couleur de bordure pour la rendre visible */
        border-radius: 20px;
        font-size: 16px;
        box-sizing: border-box;
        background-color: rgba(255, 255, 255, 0.9);
        color: #333;
        transition: border-color 0.3s ease;
    }

    form input[type="text"]:focus,
    form input[type="email"]:focus,
    form input[type="file"]:focus,
    form select:focus,
    form input[type="number"]:focus {
        border-color: #0c0c0c; /* Changez la couleur de bordure au focus */
        outline: none;
    }

    form input[type="submit"],
    .btn-success {
        background-color: #007bff;
        color: #fff;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    form input[type="submit"]:hover,
    .btn-success:hover {
        background-color: #0056b3;
    }

    .add-file {
        margin-top: 20px;
        text-align: center; /* Centrer le lien */
    }

    .add-file a {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
    }

    .add-file a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="background"></div>
<form method="post" enctype="multipart/form-data">
    <h1>Upload Cours</h1>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Upload</button>
    <div class="add-file"><a href="{% url 'cours_list' %}">Voir cours, TD ou Exercices Enregistrés</a></div>
</form>
{% endblock content %}
