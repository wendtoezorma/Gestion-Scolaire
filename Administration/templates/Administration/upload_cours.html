{% extends 'Administration/base.html' %}
{% block title %}Upload Cours{% endblock %}
{% block styles %}
{{ block.super }}

<style>
    body {
        overflow-y: auto !important; 
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: flex-start !important;
        min-height: 200vh !important;
        background: none !important;
    }

 
  
    form {
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        max-width: 900px; /* Largeur maximale du formulaire */
        text-align: left;
        background-color: rgba(255, 255, 255, 0.8);
        position: relative;
        z-index: 2;
        margin: 20px 0; /* Réduit la marge en bas et en haut du formulaire */
        display: grid;
        flex-direction: column; /* Le formulaire reste en colonne pour avoir le titre en haut */
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); /* Grille responsive */
        gap: 20px; /* Espacement entre les éléments */
    }

    .contenu{
        display: flex;
        justify-content: center; /* Centre horizontalement */
        align-items: center; /* Centre verticalement */
        height: 100vh; /* Prend toute la hauteur de la vue */
        text-align: center; /* Aligne le texte au centre */
    }

    form h2 {
        grid-column: span 2; /* Titre occupe toute la largeur */
        margin-bottom: 20px;
        color: #333;
        text-align: center;
    }
    /* Conteneur des champs, en ligne */
.form-fields {
  display: flex;
  flex-wrap: wrap; /* Permet aux éléments de s'adapter à l'espace disponible */
  gap: 20px;
  justify-content: space-between; /* Aligne les champs sur la même ligne avec de l'espace entre eux */
}
    
  
    form div {
    display: flex;
    flex-direction: column;
    
  }
  
  
  form label {
    margin-bottom: 10px;
    font-weight: bold;
    color: #333;
  }

    form input[type="text"],
    form input[type="email"],
    form input[type="file"],
    form select,
    form input[type="number"],
    form input[type="submit"],
    .btn-success {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 2px solid #0e0e0e;
        border-radius: 20px;
        font-size: 16px;
        box-sizing: border-box;
        background-color: rgba(255, 255, 255, 0.9);
        color: #333;
        transition: border-color 0.3s ease;
    }

    form input[type="text"]:focus,
    form input[type="email"]:focus,
    form input[type="file"]:focus,
    form select:focus,
    form input[type="number"]:focus {
        border-color: #0c0c0c;
        outline: none;
    }

    form input[type="submit"],
    .btn-success {
        background-color:   #0056b3;
        color: #fff;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease;
        font-size: 18px; /* Augmenter légèrement la taille des boutons */
        padding: 15px; /* Ajuster la taille des boutons */
        border-radius: 25px; /* Coins arrondis */
    }

    form input[type="submit"]:hover,
    .btn-success:hover {
        background-color:#007bff ;
    }

  

    .add-file a {
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
    }

    .add-file a:hover {
        text-decoration: underline;
    }
    .custom-btn {
        display: inline-block;
        padding: 12px 20px;
        font-size: 16px;
        font-weight: bold;
        color: white;
        background-color: #97b9dc; /* Bleu */
        border: none;
        border-radius: 25px;
        text-align: center;
        text-decoration: none;
        transition: background-color 0.3s ease;
    }

    .custom-btn:hover {
        background-color: #0056b3; /* Bleu foncé */
    }

    .add-file {
        margin-top: 20px;
        text-align: center;
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
    }

</style>
{% endblock %}

{% block content %}

<div class="contenu">
    
    <form method="post" enctype="multipart/form-data">
        <h2>Upload fichier</h2>
        <br>
        {% csrf_token %}
         <!-- Affiche les champs sous forme de paragraphes -->
          
        {{ form.as_p }}
        
            <button type="submit" class="btn btn-success">Upload</button>
            <div class="add-file">
                <a href="{% url 'cours_list' %}" class="custom-btn">Voir cours, TD ou Exercices Enregistrés</a>
            </div>
        
    </form>
</div>
{% endblock %}
